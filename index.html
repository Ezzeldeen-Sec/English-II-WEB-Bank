 const fb = done ? (a === d.a ? `<div class="fb ok">✓ إجابة صحيحة</div>` : `<div class="fb no">✗ إجابة خاطئة — الإجابة الصحيحة: ${"ABCD"[d.a]}</div>`) : "";
 
 // تم إضافة زر حل الكل تحت "إنهاء وعرض النتيجة" مباشرة بنفس الشكل مع أيقونة العين 👁
 $("box").innerHTML = `<div class="top"><button class="fl${flags.has(i) ? " on" : ""}" id="fl">${flags.has(i) ? "★ مهم" : "☆ تعليم كمهم"}</button><button class="lnk" id="fin">إنهاء وعرض النتيجة</button></div><button class="lnk" id="solve_all_btn" style="display:block; margin:4px 0 12px; color:var(--pri); font-weight:600;">👁 حل الكل وعرض الإجابات</button><p class="q">${i + 1}. ${d.q}</p>` + d.o.map((t, k) => `<button class="opt ${done ? (k === d.a ? "ok" : (k === a ? "no" : "")) : ""}" data-k="${k}">${"ABCD"[k]}. ${t}</button>`).join("") + fb + `<div class="nav"><button class="btn ghost" id="bk" ${i ? "" : "disabled"}>السابق</button><button class="btn" id="go" ${i === Q.length - 1 ? "" : ""}>${i === Q.length - 1 ? "عرض النتيجة" : "التالي"}</button></div>`;
 
 document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
   if(ans[i] !== null) return;
   ans[i] = +b.dataset.k;
   render();
 });

 $("fl").onclick = () => { flags.has(i) ? flags.delete(i) : flags.add(i); save(); render(); };
 $("fin").onclick = () => { mode = "res"; render(); };
 $("solve_all_btn").onclick = () => { solveAllCorrect(); };
 $("bk").onclick = () => { if(i > 0){ i--; render(); } };
 $("go").onclick = () => { if(i === Q.length - 1){ mode = "res"; } else { i++; } render(); };
}

function res(){
 const ok = nOk(), bad = nAns() - ok, un = Q.length - nAns(), pc = Math.round(ok / Q.length * 100);
 const wrong = ans.map((a, k) => a !== null && a !== Q[k].a ? k : -1).filter(k => k >= 0), fl = [...flags].sort((a, b) => a - b), skip = ans.map((a, k) => a === null ? k : -1).filter(k => k >= 0);
 
 save();
 $("n").textContent = "النتيجة"; $("s").textContent = ""; $("p").style.width = (nAns() / Q.length * 100) + "%";
 
 $("box").innerHTML = `<div class="c">النتيجة النهائية</div><div class="big">${pc}%</div><div class="stats"><div class="st g"><b>${ok}</b>إجابات صحيحة</div><div class="st r"><b>${bad}</b>إجابات خاطئة</div><div class="st"><b>${un}</b>لم تتم الإجابة</div><div class="st"><b>${Q.length}</b>إجمالي الأسئلة</div></div>` + (wrong.length ? `<h3>الأسئلة الخاطئة (اضغط للمراجعة)</h3>${chips(wrong, "r")}` : "") + (fl.length ? `<h3>الأسئلة المهمة ★</h3>${chips(fl, "s")}` : "") + (skip.length ? `<h3>أسئلة لم تُجب</h3>${chips(skip, "")}` : "") + `<div class="nav"><button class="btn ghost" id="bq">العودة للاختبار</button><button class="btn" id="rs">إعادة الاختبار</button></div>`;
 
 bindChips();
 $("bq").onclick = () => { mode = "quiz"; render(); };
 $("rs").onclick = () => { resetQuiz(); };
}

render();
</script>
</body>
</html>
